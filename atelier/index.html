<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
:root { --bg:#0f1117; --carte:#1a1d27; --bord:#2c3142; --texte:#e6e8ef; --gris:#8a90a2; --accent:#7c5cff; --accent2:#9479ff; --vert:#3ddc97; --rouge:#ff6b81; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--texte); font:15px/1.6 Inter, "Segoe UI", system-ui, sans-serif; }
main { max-width:960px; margin:0 auto; padding:32px max(16px, env(safe-area-inset-left)) 64px; display:grid; gap:28px; }
h1 { font-size:clamp(1.7rem,5vw,2.4rem); font-weight:800; margin:0; letter-spacing:-.02em; }
p { margin:0; } .gris { color:var(--gris); }
button, .btn { font:600 13px Inter, sans-serif; color:#fff; background:var(--accent); border:0; border-radius:6px; padding:9px 14px; cursor:pointer; }
button:hover { background:var(--accent2); } button:focus-visible, input:focus-visible { outline:2px solid var(--accent2); outline-offset:2px; }
button.discret { background:var(--carte); color:var(--texte); border:1px solid var(--bord); }
button.discret:hover { background:#242838; }
/* verrou */
#verrou { min-height:100vh; display:grid; place-items:center; padding:16px; }
#verrou form { width:100%; max-width:340px; display:grid; gap:12px; }
#verrou input { font:15px JetBrains Mono, monospace; background:var(--carte); color:var(--texte); border:1px solid var(--bord); border-radius:6px; padding:12px; width:100%; }
#erreur { color:var(--rouge); font-size:13px; min-height:1.2em; }
/* contenu */
.capture { border:1px solid var(--bord); border-radius:10px; overflow:hidden; } .capture img { display:block; width:100%; }
.onglets { display:flex; flex-wrap:wrap; gap:8px; }
.onglets button { background:var(--carte); color:var(--gris); border:1px solid var(--bord); font-family:JetBrains Mono, monospace; font-weight:400; }
.onglets button[aria-selected="true"] { color:var(--texte); border-color:var(--accent); }
.fichier { background:var(--carte); border:1px solid var(--bord); border-radius:10px; overflow:hidden; min-width:0; }
.fichier header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; border-bottom:1px solid var(--bord); }
.fichier header span { font:600 13px JetBrains Mono, monospace; } .fichier header div { display:flex; gap:8px; }
pre { margin:0; overflow-x:auto; } pre code.hljs { background:transparent; font:13px/1.55 JetBrains Mono, monospace; padding:14px; }
.astuce { font-size:13px; color:var(--gris); }
.astuce code { font-family:JetBrains Mono, monospace; color:var(--texte); }
</style>
</head>
<body>
<div id="verrou">
  <form id="formulaire">
    <h1>Atelier</h1>
    <label class="gris" for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Ouvrir</button>
    <p id="erreur" role="alert"></p>
  </form>
</div>
<main id="contenu" hidden></main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function dechiffrer(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(COFFRE.sel), iterations: COFFRE.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(COFFRE.iv) }, cle, b64(COFFRE.donnees));
  return JSON.parse(new TextDecoder().decode(clair));
}

function afficher(d) {
  const main = document.getElementById("contenu");
  main.innerHTML = `
    <section style="display:grid;gap:6px">
      <h1>${d.titre}</h1>
      <p class="gris">${d.description}</p>
    </section>
    <div class="capture"><img alt="Capture du sélecteur" src="data:image/png;base64,${d.capture}"></div>
    <div class="onglets" role="tablist"></div>
    <div id="vue"></div>
    <p class="astuce">Mets les 3 fichiers .py dans un même dossier, les CSV dans un sous-dossier <code>exemples/</code>, puis lance <code>python selecteur.py</code>.</p>`;
  const onglets = main.querySelector(".onglets"), vue = main.querySelector("#vue");
  d.fichiers.forEach((f, i) => {
    const b = document.createElement("button");
    b.textContent = f.nom; b.setAttribute("role", "tab");
    b.onclick = () => montrer(i);
    onglets.append(b);
  });
  function montrer(i) {
    const f = d.fichiers[i];
    onglets.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", i === j));
    vue.innerHTML = `<div class="fichier"><header><span></span><div>
      <button class="discret" data-action="copier">Copier</button><button data-action="telecharger">Télécharger</button></div></header>
      <pre><code></code></pre></div>`;
    vue.querySelector("header span").textContent = f.chemin;
    const code = vue.querySelector("code");
    code.textContent = f.code; code.className = "language-" + f.langage;
    if (window.hljs) hljs.highlightElement(code);
    vue.querySelector('[data-action="copier"]').onclick = async e => {
      try { await navigator.clipboard.writeText(f.code); e.target.textContent = "Copié ✓"; }
      catch { getSelection().selectAllChildren(code); e.target.textContent = "Sélectionné"; }
      setTimeout(() => e.target.textContent = "Copier", 1500);
    };
    vue.querySelector('[data-action="telecharger"]').onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([f.code], { type: "text/plain" }));
      a.download = f.nom; a.click(); URL.revokeObjectURL(a.href);
    };
  }
  montrer(0);
  document.getElementById("verrou").hidden = true;
  main.hidden = false;
}

async function essayer(mdp) {
  try {
    afficher(await dechiffrer(mdp));
    try { sessionStorage.setItem("atelier", mdp); } catch {}
    return true;
  } catch { return false; }
}

document.getElementById("formulaire").onsubmit = async e => {
  e.preventDefault();
  const ok = await essayer(document.getElementById("mdp").value);
  document.getElementById("erreur").textContent = ok ? "" : "Mot de passe incorrect.";
};

try { const m = sessionStorage.getItem("atelier"); if (m) essayer(m); } catch {}
</script>
