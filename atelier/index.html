<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Atelier</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:#222; font:15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
main { max-width:900px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:20px; }
h1 { font-size:1.5rem; margin:0; }
p { margin:0; } .gris { color:#666; }
button { font:inherit; font-size:14px; color:#222; background:#f4f4f4; border:1px solid #ccc; border-radius:4px; padding:6px 12px; cursor:pointer; }
button:hover { background:#e9e9e9; }
button:focus-visible, input:focus-visible { outline:2px solid #2b6cb0; outline-offset:1px; }
#verrou { min-height:100vh; display:grid; place-items:center; padding:16px; }
#verrou form { width:100%; max-width:300px; display:grid; gap:10px; }
#verrou input { font:inherit; border:1px solid #ccc; border-radius:4px; padding:8px; width:100%; }
#erreur { color:#c0392b; font-size:13px; min-height:1.2em; }
.capture { border:1px solid #ddd; } .capture img { display:block; width:100%; }
.onglets { display:flex; flex-wrap:wrap; gap:6px; }
.onglets button[aria-selected="true"] { background:#fff; border-color:#2b6cb0; color:#2b6cb0; }
.fichier { border:1px solid #ddd; border-radius:4px; overflow:hidden; min-width:0; }
.fichier header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; background:#f7f7f7; border-bottom:1px solid #ddd; }
.fichier header span { font:13px Consolas, ui-monospace, monospace; } .fichier header div { display:flex; gap:6px; }
pre { margin:0; overflow-x:auto; } pre code.hljs { background:#fff; font:13px/1.5 Consolas, ui-monospace, monospace; padding:12px; }
.astuce { font-size:14px; color:#555; }
.astuce code { font-family:Consolas, ui-monospace, monospace; background:#f4f4f4; padding:1px 4px; }
</style>
</head>
<body>
<div id="verrou">
  <form id="formulaire">
    <h1>Atelier</h1>
    <label class="gris" for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Ouvrir</button>
    <p id="erreur" role="alert"></p>
  </form>
</div>
<main id="contenu" hidden></main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function dechiffrer(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(COFFRE.sel), iterations: COFFRE.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(COFFRE.iv) }, cle, b64(COFFRE.donnees));
  return JSON.parse(new TextDecoder().decode(clair));
}

function afficher(d) {
  const main = document.getElementById("contenu");
  main.innerHTML = `
    <section style="display:grid;gap:6px">
      <h1>${d.titre}</h1>
      <p class="gris">${d.description}</p>
    </section>
    <div class="capture"><img alt="Capture du sélecteur" src="data:image/png;base64,${d.capture}"></div>
    <div class="onglets" role="tablist"></div>
    <div id="vue"></div>
    <p class="astuce">Mets les 3 fichiers .py dans un même dossier, les CSV dans un sous-dossier <code>exemples/</code>, puis lance <code>python selecteur.py</code>.</p>`;
  const onglets = main.querySelector(".onglets"), vue = main.querySelector("#vue");
  d.fichiers.forEach((f, i) => {
    const b = document.createElement("button");
    b.textContent = f.nom; b.setAttribute("role", "tab");
    b.onclick = () => montrer(i);
    onglets.append(b);
  });
  function montrer(i) {
    const f = d.fichiers[i];
    onglets.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", i === j));
    vue.innerHTML = `<div class="fichier"><header><span></span><div>
      <button data-action="copier">Copier</button><button data-action="telecharger">Télécharger</button></div></header>
      <pre><code></code></pre></div>`;
    vue.querySelector("header span").textContent = f.chemin;
    const code = vue.querySelector("code");
    code.textContent = f.code; code.className = "language-" + f.langage;
    if (window.hljs) hljs.highlightElement(code);
    vue.querySelector('[data-action="copier"]').onclick = async e => {
      try { await navigator.clipboard.writeText(f.code); e.target.textContent = "Copié ✓"; }
      catch { getSelection().selectAllChildren(code); e.target.textContent = "Sélectionné"; }
      setTimeout(() => e.target.textContent = "Copier", 1500);
    };
    vue.querySelector('[data-action="telecharger"]').onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([f.code], { type: "text/plain" }));
      a.download = f.nom; a.click(); URL.revokeObjectURL(a.href);
    };
  }
  montrer(0);
  document.getElementById("verrou").hidden = true;
  main.hidden = false;
}

async function essayer(mdp) {
  try {
    afficher(await dechiffrer(mdp));
    try { sessionStorage.setItem("atelier", mdp); } catch {}
    return true;
  } catch { return false; }
}

document.getElementById("formulaire").onsubmit = async e => {
  e.preventDefault();
  const ok = await essayer(document.getElementById("mdp").value);
  document.getElementById("erreur").textContent = ok ? "" : "Mot de passe incorrect.";
};

try { const m = sessionStorage.getItem("atelier"); if (m) essayer(m); } catch {}
</script>
